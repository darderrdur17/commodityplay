name: CI

# Runs on every PR into main and on every push to main.
# The typecheck job is the fast, reliable gate (no database required).
# The build job is opt-in via a repository variable — see README below.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run lint

  build:
    name: Full build (npm run build)
    runs-on: ubuntu-latest
    needs: typecheck
    # Opt-in: set repository variable CI_FULL_BUILD=true (Settings -> Secrets and
    # variables -> Actions -> Variables) once DATABASE_URL is configured below.
    if: ${{ vars.CI_FULL_BUILD == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET }}
      NEXT_PUBLIC_SITE_URL: https://www.commodityplay.ai
      NEXT_PUBLIC_APP_URL: https://www.commodityplay.ai
      NEXT_PUBLIC_PAYMENTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
